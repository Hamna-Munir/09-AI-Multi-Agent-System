<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" width="2400" height="600" role="img" aria-labelledby="t d">
  <title id="t">AI Multi-Agent System — Business Intelligence Team</title>
  <desc id="d">Banner: specialist agents feed shared evidence, which produces one verified report. Week 9 of the 90-Day AI Engineering Roadmap by Hamna Munir.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F6F5"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3EDE6"/>
      <stop offset="1" stop-color="#D6E4F5"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F5F9"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.35" stop-color="#10B981"/>
      <stop offset="0.7" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#0F2A24" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="2400" height="600" fill="url(#fade)"/></mask>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pshadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F2A3A" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F2A3A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2400" height="600" fill="url(#bg)"/>
  <rect width="2400" height="600" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="260" cy="300" r="620" fill="url(#glowL)"/>
  <circle cx="2290" cy="30" r="400" fill="url(#disc)" opacity="0.85"/>
  <circle cx="2290" cy="30" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>

  <!-- Ambient dots -->
  <g fill="#0F2A24">
    <circle cx="1390" cy="120" r="2.5" opacity="0.18"/>
    <circle cx="1402" cy="520" r="2" opacity="0.16"/>
    <circle cx="1740" cy="560" r="2.5" opacity="0.14"/>
    <circle cx="2350" cy="330" r="2.5" opacity="0.18"/>
    <circle cx="1100" cy="560" r="2" opacity="0.14"/>
  </g>

  <!-- ============ LEFT: TEXT ============ -->
  <rect x="96" y="162" width="56" height="4" rx="2" fill="#0B9A6B"/>
  <text x="176" y="172" font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="26" font-weight="600" letter-spacing="7" fill="#0B9A6B">BUSINESS INTELLIGENCE TEAM</text>

  <text x="96" y="296" font-family="Georgia,'Times New Roman',serif" font-size="100" font-weight="700" fill="#12201C" textLength="1236" lengthAdjust="spacingAndGlyphs">AI Multi-Agent System</text>

  <text x="98" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" fill="#4B5563">Specialist agents.<tspan fill="#B3BCC9" dx="16">●</tspan><tspan dx="16">Shared evidence.</tspan><tspan fill="#B3BCC9" dx="16">●</tspan><tspan fill="#0B9A6B" font-weight="600" dx="16">One verified report.</tspan></text>

  <text x="98" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" fill="#7A8599">Week 9 — 90-Day AI Engineering Roadmap<tspan fill="#C5CCD8" dx="18">|</tspan><tspan fill="#1F2937" font-weight="600" dx="18">Hamna Munir</tspan></text>

  <!-- Week progress: 9 of 13 -->
  <g>
    <rect x="98" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="142" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="186" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="230" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="274" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="318" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="362" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="406" y="492" width="36" height="9" rx="4.5" fill="#10B981"/>
    <rect x="450" y="492" width="36" height="9" rx="4.5" fill="#0B9A6B"/>
    <rect x="494" y="492" width="36" height="9" rx="4.5" fill="#0F2A24" fill-opacity="0.1"/>
    <rect x="538" y="492" width="36" height="9" rx="4.5" fill="#0F2A24" fill-opacity="0.1"/>
    <rect x="582" y="492" width="36" height="9" rx="4.5" fill="#0F2A24" fill-opacity="0.1"/>
    <rect x="626" y="492" width="36" height="9" rx="4.5" fill="#0F2A24" fill-opacity="0.1"/>
  </g>

  <!-- ============ RIGHT: SYSTEM VISUAL ============ -->
  <g font-family="'SF Mono','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" font-weight="600" letter-spacing="2.4" fill="#6B7789">
    <text x="1440" y="78">01 SPECIALIST AGENTS</text>
    <text x="1860" y="78" text-anchor="middle">02 SHARED EVIDENCE</text>
    <text x="2062" y="78">03 VERIFIED REPORT</text>
  </g>

  <!-- Connectors: agents -> hub -->
  <g fill="none" stroke-linecap="round">
    <path d="M1660 150 C1735 150 1725 300 1798 300" stroke="#3B82F6" stroke-width="2.5" stroke-opacity="0.4"/>
    <path d="M1660 250 C1735 250 1725 300 1798 300" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.45"/>
    <path d="M1660 350 C1735 350 1725 300 1798 300" stroke="#F43F5E" stroke-width="2.5" stroke-opacity="0.4"/>
    <path d="M1660 450 C1735 450 1725 300 1798 300" stroke="#8B5CF6" stroke-width="2.5" stroke-opacity="0.4"/>

    <path d="M1660 150 C1735 150 1725 300 1798 300" stroke="#2563EB" stroke-width="4" stroke-dasharray="4 16">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1660 250 C1735 250 1725 300 1798 300" stroke="#D97706" stroke-width="4" stroke-dasharray="4 16">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1660 350 C1735 350 1725 300 1798 300" stroke="#E11D48" stroke-width="4" stroke-dasharray="4 16">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1660 450 C1735 450 1725 300 1798 300" stroke="#7C3AED" stroke-width="4" stroke-dasharray="4 16">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Agent pills -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="600" fill="#14211D">
    <g>
      <rect x="1440" y="112" width="220" height="76" rx="38" fill="#FFFFFF" stroke="#3B82F6" stroke-opacity="0.75" stroke-width="2" filter="url(#pshadow)"/>
      <circle cx="1480" cy="150" r="14" fill="#3B82F6"/>
      <text x="1508" y="160">Data</text>
      <circle cx="1660" cy="150" r="6" fill="#3B82F6"/>
    </g>
    <g>
      <rect x="1440" y="212" width="220" height="76" rx="38" fill="#FFFFFF" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="2" filter="url(#pshadow)"/>
      <circle cx="1480" cy="250" r="14" fill="#F59E0B"/>
      <text x="1508" y="260">Market</text>
      <circle cx="1660" cy="250" r="6" fill="#F59E0B"/>
    </g>
    <g>
      <rect x="1440" y="312" width="220" height="76" rx="38" fill="#FFFFFF" stroke="#F43F5E" stroke-opacity="0.75" stroke-width="2" filter="url(#pshadow)"/>
      <circle cx="1480" cy="350" r="14" fill="#F43F5E"/>
      <text x="1508" y="360">Finance</text>
      <circle cx="1660" cy="350" r="6" fill="#F43F5E"/>
    </g>
    <g>
      <rect x="1440" y="412" width="220" height="76" rx="38" fill="#FFFFFF" stroke="#8B5CF6" stroke-opacity="0.75" stroke-width="2" filter="url(#pshadow)"/>
      <circle cx="1480" cy="450" r="14" fill="#8B5CF6"/>
      <text x="1508" y="460">Risk</text>
      <circle cx="1660" cy="450" r="6" fill="#8B5CF6"/>
    </g>
  </g>

  <!-- Hub -->
  <circle cx="1860" cy="300" r="150" fill="url(#hubGlow)"/>
  <circle cx="1860" cy="300" r="104" fill="none" stroke="#10B981" stroke-opacity="0.65" stroke-width="2.5" stroke-dasharray="3 13" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 1860 300" to="360 1860 300" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1860" cy="300" r="82" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="1860" cy="300" r="62" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#pshadow)"/>
  <circle cx="1860" cy="300" r="40" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="1860" cy="300" r="17" fill="#10B981" filter="url(#glow)">
    <animate attributeName="r" values="17;20;17" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Hub -> report -->
  <path d="M1926 300 H2036" fill="none" stroke="#0B9A6B" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 14">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <polygon points="2034,286 2058,300 2034,314" fill="#0B9A6B"/>

  <!-- Report card -->
  <g filter="url(#shadow)">
    <rect x="2062" y="160" width="238" height="290" rx="20" fill="url(#card)" stroke="#D9E0EA" stroke-width="1.5"/>
  </g>
  <rect x="2088" y="192" width="112" height="14" rx="7" fill="#1F2937"/>
  <rect x="2088" y="218" width="72" height="9" rx="4.5" fill="#A9B4C5"/>
  <line x1="2088" y1="250" x2="2274" y2="250" stroke="#E3E8EF" stroke-width="2"/>
  <!-- mini chart -->
  <rect x="2092" y="330" width="26" height="30" rx="5" fill="#3B82F6"/>
  <rect x="2130" y="306" width="26" height="54" rx="5" fill="#F59E0B"/>
  <rect x="2168" y="320" width="26" height="40" rx="5" fill="#F43F5E"/>
  <rect x="2206" y="282" width="26" height="78" rx="5" fill="#8B5CF6"/>
  <rect x="2244" y="296" width="26" height="64" rx="5" fill="#10B981"/>
  <line x1="2088" y1="368" x2="2274" y2="368" stroke="#D5DCE6" stroke-width="2"/>
  <rect x="2088" y="388" width="186" height="9" rx="4.5" fill="#D5DCE6"/>
  <rect x="2088" y="408" width="140" height="9" rx="4.5" fill="#D5DCE6"/>

  <!-- Verified badge -->
  <circle cx="2298" cy="164" r="38" fill="#10B981" stroke="#FFFFFF" stroke-width="6" filter="url(#pshadow)"/>
  <path d="M2281 165 L2294 178 L2317 152" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom accent strip -->
  <rect x="0" y="592" width="2400" height="8" fill="url(#strip)"/>
  <rect x="0.75" y="0.75" width="2398.5" height="598.5" fill="none" stroke="#0F2A24" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
